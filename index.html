<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description"
        content="JSON Formatter and Validator - format, minify, validate, and syntax-highlight JSON in your browser. No server, no dependencies." />
    <title>JSON Formatter &amp; Validator</title>
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <!-- made by hanx https://hanx.pro -->
    <!-- last update/touched 26.08.2026 -->
    <header class="header">
        <div class="header-left">
            <div class="logo-mark" aria-hidden="true">
                <svg viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg">
                    <text x="1" y="13" font-family="monospace" font-size="11" fill="#fff">{}</text>
                </svg>
            </div>
            <div>
                <div class="header-title">JSON Tool</div>
                <div class="header-subtitle">Formatter &amp; Validator</div>
            </div>
        </div>
        <div class="header-right">
            Made by <a href="https://hanx.lol" target="_blank" rel="noopener">hanx.lol</a>
        </div>
    </header>

    <div class="toolbar" role="toolbar" aria-label="JSON Actions">

        <button id="btn-format" class="btn btn-primary" title="Format JSON (Ctrl+Enter)">
            <svg viewBox="0 0 24 24">
                <polyline points="9 18 15 12 9 6" />
            </svg>
            Format
        </button>

        <button id="btn-minify" class="btn" title="Minify JSON (Ctrl+M)">
            <svg viewBox="0 0 24 24">
                <polyline points="15 18 9 12 15 6" />
            </svg>
            Minify
        </button>

        <button id="btn-validate" class="btn btn-success" title="Validate JSON">
            <svg viewBox="0 0 24 24">
                <polyline points="20 6 9 17 4 12" />
            </svg>
            Validate
        </button>

        <div class="toolbar-sep" aria-hidden="true"></div>

        <button id="btn-example" class="btn" title="Load example JSON">
            <svg viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="10" />
                <line x1="12" y1="8" x2="12" y2="12" />
                <line x1="12" y1="16" x2="12.01" y2="16" />
            </svg>
            Example
        </button>

        <button id="btn-upload" class="btn" title="Upload .json file">
            <svg viewBox="0 0 24 24">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                <polyline points="17 8 12 3 7 8" />
                <line x1="12" y1="3" x2="12" y2="15" />
            </svg>
            Upload
        </button>
        <input type="file" id="file-upload" accept=".json,application/json" aria-label="Upload JSON file" />

        <div class="toolbar-sep" aria-hidden="true"></div>

        <button id="btn-copy" class="btn" title="Copy formatted JSON">
            <svg viewBox="0 0 24 24">
                <rect x="9" y="9" width="13" height="13" rx="2" ry="2" />
                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" />
            </svg>
            Copy
        </button>

        <button id="btn-download" class="btn" title="Download JSON file">
            <svg viewBox="0 0 24 24">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                <polyline points="7 10 12 15 17 10" />
                <line x1="12" y1="15" x2="12" y2="3" />
            </svg>
            Download
        </button>

        <div class="toolbar-sep" aria-hidden="true"></div>

        <button id="btn-clear" class="btn btn-danger" title="Clear editor (Ctrl+K)">
            <svg viewBox="0 0 24 24">
                <polyline points="3 6 5 6 21 6" />
                <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6" />
                <path d="M10 11v6" />
                <path d="M14 11v6" />
            </svg>
            Clear
        </button>

        <div class="toolbar-sep" aria-hidden="true"></div>

        <div class="select-wrap">
            <label for="indent-select">Indent:</label>
            <select id="indent-select" aria-label="Indentation size">
                <option value="2" selected>2 Spaces</option>
                <option value="4">4 Spaces</option>
                <option value="tab">Tabs</option>
            </select>
        </div>

    </div>

    <main class="main" role="main">

        <section class="pane pane-left" aria-label="JSON Input">
            <div class="pane-header">
                <span class="pane-title">Input</span>
                <div class="pane-actions">
                    <span class="pane-hint">Ctrl+Enter to format</span>
                </div>
            </div>
            <textarea id="json-input" spellcheck="false" autocorrect="off" autocapitalize="off" autocomplete="off"
                placeholder="Paste or type JSON here..." aria-label="JSON input editor"></textarea>
        </section>

        <section class="pane pane-right" aria-label="JSON Output">
            <div class="pane-header">
                <span class="pane-title">Output</span>
                <div class="pane-actions">
                    <span class="pane-hint">Syntax highlighted</span>
                </div>
            </div>
            <div class="output-area" id="output-wrap">
                <code id="json-output" aria-live="polite" aria-label="Formatted JSON output"></code>
            </div>
        </section>

        <div id="error-detail" role="alert" aria-live="assertive"></div>

        <footer class="statusbar" aria-label="Status bar">
            <div id="status-msg" class="status-msg idle">
                <span id="status-dot" class="status-dot"></span>
                <span id="status-text">Ready</span>
            </div>
            <div class="status-stats">
                <div class="stat-item">Chars: <span id="char-count">0</span></div>
                <div class="stat-item">Lines: <span id="line-count">0</span></div>
            </div>
        </footer>

    </main>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <script src="script.js"></script>
</body>

</html>
